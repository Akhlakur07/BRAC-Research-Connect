<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRACU Research Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-slate-900 antialiased">
    <div id="root">
      <div
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;color:#475569;"
      >
        <div
          style="width:40px;height:40px;border:3.5px solid #fbe6ec;border-top-color:#7b1e3c;border-radius:9999px;animation:brc-spin 0.8s linear infinite;"
        ></div>
        <p style="margin-top:16px;font-size:16px;font-weight:500;">
          Loading BRACU Research Connect...
        </p>
        <style>
          @keyframes brc-spin {
            to {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
